name: Compile Backend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  compile-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile with Maven
        working-directory: ./app
        run: mvn clean compile